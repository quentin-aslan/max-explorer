services:
  app:
    image: ${APP_IMAGE:-ghcr.io/quentin-aslan/max-explorer:latest}
    build:
      context: .
      target: production
    container_name: max-explorer-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL
      - OPEN_WEATHER_MAP_API_KEY
      - LAUNCH_CRON_ON_INIT
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migration:
    image: ${MIGRATION_IMAGE:-ghcr.io/quentin-aslan/max-explorer-migration:latest}
    build:
      context: .
      target: migration
    container_name: max-explorer-migration
    environment:
      - DATABASE_URL
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18
    container_name: max-explorer-db
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres:
