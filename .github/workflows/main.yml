name: Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start services (Postgres)
        run: npm run docker:up

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..20}; do
            if docker exec max-explorer-db pg_isready -U max-explorer; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Still waiting for PostgreSQL... ($i)"
            sleep 3
          done

      - name: Run tests
        run: npm run test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migration
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migration:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OPEN_WEATHER_MAP_API_KEY: ${{ secrets.OPEN_WEATHER_MAP_API_KEY }}
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          envs: DATABASE_URL,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,OPEN_WEATHER_MAP_API_KEY,CR_PAT,GITHUB_ACTOR,GITHUB_REPOSITORY
          script: |
            echo "🚀 Starting deployment..."

            cd ~/dev/max-explorer

            echo "🔄 Pulling latest code"
            git checkout .
            git pull origin main

            echo "🔑 Logging into GitHub Container Registry"
            echo "$CR_PAT" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "📦 Pulling new images"
            sudo docker pull ghcr.io/${GITHUB_REPOSITORY}:latest
            sudo docker pull ghcr.io/${GITHUB_REPOSITORY}-migration:latest

            echo "🐳 Starting containers"
            export DATABASE_URL="$DATABASE_URL"
            export POSTGRES_USER="$POSTGRES_USER"
            export POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
            export POSTGRES_DB="$POSTGRES_DB"
            export OPEN_WEATHER_MAP_API_KEY="$OPEN_WEATHER_MAP_API_KEY"
            export LAUNCH_CRON_ON_INIT=true
            export APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY}:latest
            export MIGRATION_IMAGE=ghcr.io/${GITHUB_REPOSITORY}-migration:latest

            sudo docker compose -f docker-compose.prod.yml down
            sudo docker compose -f docker-compose.prod.yml up -d

            echo "🧹 Cleaning old images"
            sudo docker image prune -f

            echo "✅ Deployment complete!"
